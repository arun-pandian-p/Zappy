<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#crestBg)" stroke="url(#crestGold)" stroke-width="2.5" />
  
  <!-- Subtle Inner Border -->
  <rect x="9" y="9" width="82" height="82" rx="20" fill="none" stroke="#FBBF24" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.4" />

  <!-- Cloche / Dome -->
  <path d="M50 25 C36 25 28 35 28 45 L72 45 C72 35 64 25 50 25 Z" fill="url(#crestGold)" opacity="0.9" />
  <!-- Cloche Handle -->
  <ellipse cx="50" cy="22" rx="4" ry="3" fill="#FDE68A" />
  <rect x="48.5" y="23" width="3" height="3" fill="#D97706" />
  
  <!-- Cloche Base Tray -->
  <rect x="24" y="47" width="52" height="3.5" rx="1.75" fill="#FDE68A" />

  <!-- Crossed Fork & Spoon Below Tray -->
  <g stroke="url(#crestGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fork diagonal -->
    <line x1="33" y1="58" x2="67" y2="78" />
    <!-- Spoon diagonal -->
    <line x1="67" y1="58" x2="33" y2="78" />
  </g>

  <!-- Fork Prongs (left top) -->
  <path d="M30 54 L32 59 M33 53 L34 58 M36 53 L36 58" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round" />
  <!-- Spoon Bowl (right top) -->
  <ellipse cx="67" cy="57" rx="3.5" ry="5" transform="rotate(30 67 57)" fill="#FDE68A" />

  <!-- Star Embellishment -->
  <polygon points="50,65 52,70 57,70 53,73 55,78 50,75 45,78 47,73 43,70 48,70" fill="#F59E0B" opacity="0.9" />
</svg>
