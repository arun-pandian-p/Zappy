server:
  port: 8080

spring:
  application:
    name: zappy-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.yqdblmkqlnhtbztpfuwm.supabase.co:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:aRUNOLIVER2030@}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT and Security properties
zappy:
  security:
    jwt:
      # Base64 encoded secret key for HMAC-SHA256 (256-bit min)
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: 86400000 # 24 hours
      refresh-token-expiration-ms: 604800000 # 7 days
      reset-token-expiration-ms: 3600000 # 1 hour
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:3000}

